[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "record-pruner"
version = "0.1.0"
description = "録画ファイル群を整理するスクリプト集"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
fix-split-filenames = "scripts.fix_split_filenames:main"


[tool.hatch.build.targets.wheel]
packages = ["src/lib", "src/scripts"]



